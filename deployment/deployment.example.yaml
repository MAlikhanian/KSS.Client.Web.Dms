# =============================================================================
#  KSS Client Web — dms domain app (multi-zone)
# =============================================================================
#  Modelled on CustomerRisk/deployment/deployment.yaml — the nearest structural
#  peer, not CashAdvance. Like CustomerRisk, DMS declares Auth, its own
#  service and tenants, and nothing else. Every identifier below was derived from domains.json
#  (folder "Dms", slug "dms", zone false) rather than adapted from another
#  zone's file, because the known failure in this estate is a manifest that is
#  correct in most fields.
#
#  ---------------------------------------------------------------------------
#  ✅ The health route exists (app/api/health/route.ts) and the three probes
#  below hit it. middleware.ts excludes api/health from its session check, so
#  the probe answers without a session — it must, or a healthy pod would be
#  redirected to sign-in and restarted.
#
#  ---------------------------------------------------------------------------
#  1. NO INGRESS — AND NOT FOR THE REASON THE OTHER ZONES GIVE.
#
#  Every other zone's manifest says "this app has no middleware.ts, so direct
#  exposure would give an unauthenticated visitor a rendering page instead of a
#  redirect to sign-in". THAT SENTENCE IS FALSE HERE. DMS is the only zone in
#  the estate that HAS a middleware.ts. Copying it in would have shipped a
#  false comment into the one file where it does not hold.
#
#  middleware.ts now VERIFIES the Auth session (the NextAuth JWT, with
#  NEXTAUTH_SECRET) and the caller's DMS role on every request, and fails
#  closed. That still does not make an Ingress here a good idea: the Shell is
#  the estate's single public entrypoint, and a second one is a second thing to
#  keep in step with it.
#
#  NO INGRESS HOST IS SET ANYWHERE IN THIS FILE, and that is still correct.
#
#  ⓘ 2026-09-08: when this was written the routing role of mkoffice.ir was
#  INFERRED, and refusing to commit an inferred hostname was right. Mohammad has
#  since STATED it — a new tenant company on mkoffice.ir. It is no longer an
#  inference. It still does not belong here: a tenant host reaches DMS through
#  the Shell like every other host, never through an Ingress on this zone.
#
#  ---------------------------------------------------------------------------
#  2. ✅ COMPOSED 2026-09-08. WAS "NOT A ZONE" — HELD 2026-09-07 TO 2026-09-08.
#
#  WHILE IT HELD, domains.json line 184 read "zone": false with heldBackReason.
#  Quoted here as the HISTORICAL value — the row no longer says this:
#    "Frontend and mock data only by Mohammad's ruling 2026-09-07 — no
#     database, no backend service. NOT sellable and NOT composed until a
#     backend exists."
#
#  THAT TEXT STOPPED A BUILD ORDER ON 2026-09-08 AND WAS CORRECT TO. Being
#  DEPLOYABLE is not being DEPLOYED — and it became DEPLOYED by a separate
#  decision, which is exactly how it was supposed to happen.
#
#  LIFTED 2026-09-08 on Mohammad's instruction. domains.json is now "zone": true
#  with a note carrying the same reasoning, and dms is a key in the Shell's
#  ConfigMap zones value (13 keys).
#
#  2026-09-29: WIRED. The data comes from the DMS service
#  (KSS.Service.SEBA_ERP_Dms); the zone holds none. See section 3.
#
#  ---------------------------------------------------------------------------
#  3. DATA LIVES IN THE DMS SERVICE, NOT IN THE BROWSER.
#
#  Every data call goes through this zone's own proxy (app/api/dms/[...path]
#  and services/dms-api.ts) to DMS_API_BASE_URL, as the signed-in user: the
#  session token and the active company (x-company-id) travel with it, and the
#  service checks role, permission and company on every request.
#
#  ---------------------------------------------------------------------------
#  THREE THINGS ARE NOT IN THIS FILE, in order of how quietly each one fails:
#
#   A. docker-secret, in THIS namespace.
#      Secrets are namespace-scoped; the one in kss-client-web does not carry
#      over. Pods sit in ImagePullBackOff — loud, and describe names the cause.
#
#   B. nextauth-secret, copied from the Shell.
#      Deliberately absent from the Secret below. CreateContainerConfigError
#      until it exists — loud by design. See the note at NEXTAUTH_SECRET, which
#      does NOT repeat the other zones' justification, because it is not true
#      of this app.
#
#   C. app/api/health/route.ts, in the repo. The precondition above. It is
#      listed here because it belongs in the same list: it is the one that
#      fails at a layer where the manifest looks correct.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: kss-client-web-dms
  labels:
    name: kss-client-web-dms
    app: kss-client-web-dms
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kss-client-web-dms
  namespace: kss-client-web-dms
  labels:
    app: kss-client-web-dms
    version: v1.0.0
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: kss-client-web-dms
  template:
    metadata:
      labels:
        app: kss-client-web-dms
        version: v1.0.0
    spec:
      imagePullSecrets:
      - name: docker-secret
      containers:
      - name: kss-client-web-dms
        image: docker-hosted.sebaoffice.ir/kss-client-web-dms:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: TZ
          value: "UTC"

        # The NextAuth session cookie carries every permission claim (~25 KB
        # JWE-encoded) and overflows Node's default 16 KB header buffer. This
        # zone receives that same cookie, so it needs the same allowance or the
        # request arrives as HTTP 431 / 502.
        - name: NODE_OPTIONS
          value: "--max-http-header-size=131072"

        # ── Auth ────────────────────────────────────────────────────────────
        # ⚠ MUST BE BYTE-IDENTICAL TO THE SHELL'S.
        #
        # LOAD-BEARING IN THIS ZONE. middleware.ts decodes the session with it on
        # EVERY request (getToken) and the DMS proxy reads the session with it
        # (getServerSession). A missing or different value decodes to no session,
        # so EVERY request is refused and sent to sign-in — a sign-in loop, not a
        # red pod. It must equal the Shell's exactly.
        #
        # An EMPTY value would be worse than absent: valid base64, so the key
        # exists, the pod STARTS, and every request is refused. A checked-in key
        # would also be re-blanked by every `kubectl apply`.
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: kss-client-web-dms-secrets
              key: nextauth-secret

        # The public origin. Cookies are scoped by host and path, never by port
        # or by which pod answered — so this stays the Shell's URL.
        - name: NEXTAUTH_URL
          value: "https://erp.seba.ir"

        # Used by next.config.mjs to proxy /api/auth/* back to the Shell. That
        # rewrite is DEV-ONLY (returns [] when NODE_ENV !== development), so in
        # cluster this is inert — set for parity and for local `docker run`.
        - name: SHELL_URL
          value: "https://erp.seba.ir"

        # ── Application ─────────────────────────────────────────────────────
        # NEXT_PUBLIC_BASE_PATH is inlined at BUILD time by the Dockerfile ARG
        # (Dockerfile:22 already defaults it to "/dms"), not read here. Set at
        # runtime too so a mismatch shows in `kubectl describe` rather than only
        # as broken asset URLs. It must equal next.config.mjs's basePath.
        - name: NEXT_PUBLIC_BASE_PATH
          value: "/dms"
        - name: NEXT_PUBLIC_APP_NAME
          value: "KSS_Client_Web_dms"

        # ── Tenant branding ─────────────────────────────────────────────────
        # Same ConfigMap pattern as the Shell's. Read by lib/tenants.ts
        # (parseTenants defaults its argument to process.env.TENANTS) and
        # consumed by providers/tenant-provider.tsx. Value is generated from the
        # SHELL manifest by _Kit tooling — all 13 carry a byte-identical object,
        # verified by md5 before this file was written, and the line below was
        # copied programmatically rather than transcribed.
        # configMapKeyRef is frozen at container start: changing the ConfigMap
        # needs a rollout restart, not just an apply.
        - name: TENANTS
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-dms-config
              key: tenants

        # ── Backend services ────────────────────────────────────────────────
        # TWO: Auth (services/auth-api.ts reads AUTH_API_BASE_URL and throws if it
        # is unset) and the DMS service (below). No other service is called.
        - name: AUTH_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-dms-config
              key: auth-api-base-url
        # The DMS service, read by services/dms-api.ts (the zone's proxy).
        # Deliberately NOT `optional`: without it every data route answers 503,
        # so a missing key should stop the pod from starting instead.
        - name: DMS_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: kss-client-web-dms-config
              key: dms-api-base-url

        # ── Object storage ──────────────────────────────────────────────────
        # Referenced by shared lib code copied in from _Kit (lib/s3-client.ts,
        # lib/s3-upload.ts). Stated precisely: NOTHING IN THIS APP IMPORTS
        # EITHER FILE except s3-upload importing s3-client — they are currently
        # unreachable. Kept for parity with the estate and marked optional, so
        # an absent secret does not block startup. This app has no upload path.
        - name: STORAGE_ENDPOINT
          valueFrom:
            secretKeyRef: { name: kss-client-web-dms-secrets, key: storage-endpoint, optional: true }
        - name: STORAGE_REGION
          valueFrom:
            secretKeyRef: { name: kss-client-web-dms-secrets, key: storage-region, optional: true }
        - name: STORAGE_BUCKET
          valueFrom:
            secretKeyRef: { name: kss-client-web-dms-secrets, key: storage-bucket, optional: true }
        - name: STORAGE_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef: { name: kss-client-web-dms-secrets, key: storage-access-key-id, optional: true }
        - name: STORAGE_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef: { name: kss-client-web-dms-secrets, key: storage-secret-access-key, optional: true }
        - name: STORAGE_CDN_URL
          valueFrom:
            secretKeyRef: { name: kss-client-web-dms-secrets, key: storage-cdn-url, optional: true }

        # One forwarding route (app/api/dms/[...path]), no uploads — the standard zone profile that
        # 12 of 13 zones carry, NOT CashAdvance's larger one (which is stated
        # there as being for 49 pages and 34 BFF routes).
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # ── Probes ──────────────────────────────────────────────────────────
        # ⚠ THESE DEPEND ON app/api/health/route.ts, WHICH DOES NOT EXIST YET.
        # See the precondition at the top of this file. timeoutSeconds is
        # explicit on all three; the default is 1s and a cold start exceeds it.
        livenessProbe:
          httpGet: { path: /dms/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet: { path: /dms/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet: { path: /dms/api/health, port: 3000, scheme: HTTP }
          periodSeconds: 5
          timeoutSeconds: 5
          # 24, the value 12 of 13 zones carry - NOT CashAdvance's 36, which
          # its own file justifies by a 49-page cold start. DMS has 7 pages.
          failureThreshold: 24

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kss-client-web-dms-service
  namespace: kss-client-web-dms
  labels:
    app: kss-client-web-dms
spec:
  selector:
    app: kss-client-web-dms
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
  sessionAffinity: None
---
# auth-api-base-url copied verbatim from the Shell's kss-client-web-config so
# the two cannot drift. It is a PUBLIC hostname, matching the Shell exactly —
# that is the Shell's choice, not a decision taken here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kss-client-web-dms-config
  namespace: kss-client-web-dms
data:
  auth-api-base-url: "https://auth.api.sebaoffice.ir"
  # The DMS service in its own namespace: the FULL cluster name, because the bare
  # service name resolves only inside kss-dms-service. No port: the Service
  # listens on 80 and forwards to the pod's 8000.
  dms-api-base-url: "http://kss-dms-service-service.kss-dms-service.svc.cluster.local"
  tenants: '{"erp.seba.ir":{"name":"SEBA","logo":"/media/app/default-logo.svg","logoDark":"/media/app/default-logo-dark.svg","logoMini":"/media/app/mini-logo.svg","favicon":"/favicon.ico","banner":"/media/images/2600x1600/1.png","bannerDark":"/media/images/2600x1600/1-dark.png","companyId":"019f317a-12ba-764f-b19b-e064e36b4be8","footer":{"brand":{"label":"SEBA","href":"https://seba.ir"},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"Support","fa":"پشتیبانی","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"License","fa":"مجوز","href":""}]}},"members.sebaoffice.ir":{"name":"SEBA","logo":"/media/app/default-logo.svg","logoDark":"/media/app/default-logo-dark.svg","logoMini":"/media/app/mini-logo.svg","favicon":"/favicon.ico","banner":"/media/images/2600x1600/1.png","bannerDark":"/media/images/2600x1600/1-dark.png","companyId":"019f317a-12ba-764f-b19b-e064e36b4be8","footer":{"brand":{"label":"SEBA","href":"https://seba.ir"},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"Support","fa":"پشتیبانی","href":"https://www.seba.ir/%D8%AA%D9%85%D8%A7%D8%B3-%D8%A8%D8%A7-%DA%A9%D8%A7%D9%86%D9%88%D9%86"},{"en":"License","fa":"مجوز","href":""}]}},"nerp.sajoffice.ir":{"name":"SAJ","logo":"/media/tenants/saj/logo.png","logoDark":"/media/tenants/saj/logo.png","logoMini":"/media/tenants/saj/logo.png","favicon":"/media/tenants/saj/favicon.png","banner":"/media/tenants/saj/banner.jpg","bannerDark":"/media/tenants/saj/banner.jpg","companyId":"019f0e6c-9fbc-78cf-9202-fa932a9878f7","footer":{"brand":{"label":"SAJ","href":""},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]}},"erp.mpfoffice.ir":{"name":"MPF","logo":"/media/tenants/mpf/logo.svg","logoDark":"/media/tenants/mpf/logo-dark.svg","logoMini":"/media/tenants/mpf/logo-mini.svg","favicon":"/media/tenants/mpf/favicon.svg","banner":"/media/tenants/mpf/banner.svg","bannerDark":"/media/tenants/mpf/banner-dark.svg","companyId":"019f7a3e-1d43-7bcb-a7f3-eb97572e2e02","footer":{"brand":{"label":"MPF","href":""},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]}},"spmoffice.ir":{"name":"SPM","logo":"/media/tenants/spm/logo.svg","logoDark":"/media/tenants/spm/logo-dark.svg","logoMini":"/media/tenants/spm/logo-mini.svg","favicon":"/media/tenants/spm/favicon.svg","banner":"/media/tenants/spm/banner.svg","bannerDark":"/media/tenants/spm/banner-dark.svg","companyId":"01a04744-68ae-7aef-b9d0-b5fb31d7a80c","footer":{"brand":{"label":"SPM","href":""},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]}},"mkoffice.ir":{"name":"MK","footer":{"brand":{"label":"مشیران کاریز","href":"https://moshirankariz.com"},"links":[{"en":"Docs","fa":"مستندات","href":""},{"en":"Purchase","fa":"خرید","href":""},{"en":"FAQ","fa":"سوالات متداول","href":""},{"en":"Support","fa":"پشتیبانی","href":""},{"en":"License","fa":"مجوز","href":""}]},"logo":"/media/tenants/mk/logo.png","logoDark":"/media/tenants/mk/logo.png","logoMini":"/media/tenants/mk/logo.png","favicon":"/media/tenants/mk/favicon.ico","banner":"/media/tenants/mk/banner.jpg","bannerDark":"/media/tenants/mk/banner.jpg","companyId":"01a07fb0-e2e7-7822-b14b-3a70278009ef"}}'
---
# ⚠ `nextauth-secret` IS NOT IN THIS FILE, AND MUST NOT BE ADDED TO IT.
# See the NEXTAUTH_SECRET note above. Absent + non-optional is the loud
# failure; empty would be the silent one, and a checked-in key would be
# re-blanked by every `kubectl apply`.
#
# The storage keys below are present-and-empty rather than absent, matching
# every other zone: each is referenced with `optional: true`, so an empty
# string is read as an empty string and the unreachable s3 lib never runs.
apiVersion: v1
kind: Secret
metadata:
  name: kss-client-web-dms-secrets
  namespace: kss-client-web-dms
type: Opaque
data:
  storage-endpoint: "<STORAGE_ENDPOINT_BASE64>"
  storage-region: "<STORAGE_REGION_BASE64>"
  storage-bucket: "<STORAGE_BUCKET_BASE64>"
  storage-access-key-id: "<STORAGE_ACCESS_KEY_ID_BASE64>"
  storage-secret-access-key: "<STORAGE_SECRET_ACCESS_KEY_BASE64>"
  storage-cdn-url: "<STORAGE_CDN_URL_BASE64>"
---
# minAvailable 1 against replicas 2 — the profile 12 of 13 zones carry.
# It must stay strictly below replicas or a drain deadlocks.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kss-client-web-dms-pdb
  namespace: kss-client-web-dms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kss-client-web-dms
---
# Ingress ONLY from the kss-client-web namespace — this is the second half of
# "the Shell is the only public entrypoint". Without it, the absence of an
# Ingress object is a routing fact rather than a control: any pod in the
# cluster could still reach port 3000 directly.
#
# ⛔⛔ 2026-09-09 — DO NOT APPLY THIS NETWORKPOLICY. IT WOULD BREAK DNS. ⛔⛔
#
#  The egress list below is TCP 80/443/8000 ONLY. **DNS IS UDP 53 AND IS NOT IN IT.**
#  Applying this costs the DMS pods name resolution, and with it `kss-auth-service`.
#  Sign-in stops. The pods stay Running and the readiness probe still passes, because
#  /dms/api/health resolves nothing external — so it fails as a customer symptom, not
#  as a red pod.
#
#  MINE. I wrote this block, and the comment under it — "deliberately wide, matching
#  the estate" — is me copying an estate pattern and then JUSTIFYING it in prose.
#  The reasoning about AUTH_API_BASE_URL being a public hostname is correct and is
#  exactly what made the omission invisible: I checked that the ALLOWED ports were
#  right and never asked what was MISSING from the list.
#
#  Found by Amanda 2026-09-09 on `Mpf/deployment/deployment.yaml` via `kubectl diff`,
#  before applying it. NO ZONE HAS A NETWORKPOLICY IN PRODUCTION TODAY — so this file
#  is unapplied and nothing is broken. The danger is entirely that it LOOKS FINISHED.
#
#  NOT FIXED HERE ON PURPOSE. Adding `- { protocol: UDP, port: 53 }` would make it
#  applicable, and applying it would create a NetworkPolicy no other zone has — which
#  is the manifest-versus-production drift Amanda has named as real work, not a side
#  effect of a one-line patch. That reconciliation is hers to sequence.
#
# Egress is deliberately wide (0.0.0.0/0 on 80/443/8000), matching the estate:
# AUTH_API_BASE_URL is a PUBLIC hostname, so a namespace-scoped egress rule
# would break sign-in rather than tighten anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kss-client-web-dms-network-policy
  namespace: kss-client-web-dms
spec:
  podSelector:
    matchLabels:
      app: kss-client-web-dms
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kss-client-web
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - { protocol: TCP, port: 80 }
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 8000 }
