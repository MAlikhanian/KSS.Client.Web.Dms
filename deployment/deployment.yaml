---
# ⚠ `nextauth-secret` IS NOT IN THIS FILE, AND MUST NOT BE ADDED TO IT.
# See the NEXTAUTH_SECRET note above. Absent + non-optional is the loud
# failure; empty would be the silent one, and a checked-in key would be
# re-blanked by every `kubectl apply`.
#
# The storage keys below are present-and-empty rather than absent, matching
# every other zone: each is referenced with `optional: true`, so an empty
# string is read as an empty string and the unreachable s3 lib never runs.
apiVersion: v1
kind: Secret
metadata:
  name: kss-client-web-dms-secrets
  namespace: kss-client-web-dms
type: Opaque
data:
  storage-endpoint: ""
  storage-region: ""
  storage-bucket: ""
  storage-access-key-id: ""
  storage-secret-access-key: ""
  storage-cdn-url: ""
---
# minAvailable 1 against replicas 2 — the profile 12 of 13 zones carry.
# It must stay strictly below replicas or a drain deadlocks.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kss-client-web-dms-pdb
  namespace: kss-client-web-dms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kss-client-web-dms
---
# Ingress ONLY from the kss-client-web namespace — this is the second half of
# "the Shell is the only public entrypoint". Without it, the absence of an
# Ingress object is a routing fact rather than a control: any pod in the
# cluster could still reach port 3000 directly.
#
# ⛔⛔ 2026-09-09 — DO NOT APPLY THIS NETWORKPOLICY. IT WOULD BREAK DNS. ⛔⛔
#
#  The egress list below is TCP 80/443/8000 ONLY. **DNS IS UDP 53 AND IS NOT IN IT.**
#  Applying this costs the DMS pods name resolution, and with it `kss-auth-service`.
#  Sign-in stops. The pods stay Running and the readiness probe still passes, because
#  /dms/api/health resolves nothing external — so it fails as a customer symptom, not
#  as a red pod.
#
#  MINE. I wrote this block, and the comment under it — "deliberately wide, matching
#  the estate" — is me copying an estate pattern and then JUSTIFYING it in prose.
#  The reasoning about AUTH_API_BASE_URL being a public hostname is correct and is
#  exactly what made the omission invisible: I checked that the ALLOWED ports were
#  right and never asked what was MISSING from the list.
#
#  Found by Amanda 2026-09-09 on `Mpf/deployment/deployment.yaml` via `kubectl diff`,
#  before applying it. NO ZONE HAS A NETWORKPOLICY IN PRODUCTION TODAY — so this file
#  is unapplied and nothing is broken. The danger is entirely that it LOOKS FINISHED.
#
#  NOT FIXED HERE ON PURPOSE. Adding `- { protocol: UDP, port: 53 }` would make it
#  applicable, and applying it would create a NetworkPolicy no other zone has — which
#  is the manifest-versus-production drift Amanda has named as real work, not a side
#  effect of a one-line patch. That reconciliation is hers to sequence.
#
# Egress is deliberately wide (0.0.0.0/0 on 80/443/8000), matching the estate:
# AUTH_API_BASE_URL is a PUBLIC hostname, so a namespace-scoped egress rule
# would break sign-in rather than tighten anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kss-client-web-dms-network-policy
  namespace: kss-client-web-dms
spec:
  podSelector:
    matchLabels:
      app: kss-client-web-dms
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kss-client-web
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - { protocol: TCP, port: 80 }
    - { protocol: TCP, port: 443 }
    - { protocol: TCP, port: 8000 }
